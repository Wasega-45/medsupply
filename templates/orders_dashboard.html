{% extends 'base.html' %}

{% block title %}Orders Dashboard - MedSupply Kenya{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Orders Dashboard <span class="badge badge-green" id="live-badge">● LIVE</span></h1>
    <p>Auto-refreshing every 5 seconds · <span id="updated" style="color: #14b8a6;">loading...</span></p>
</div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Facility</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Requested</th>
        </tr>
    </thead>
    <tbody id="orders-table">
        <tr>
            <td colspan="5" style="text-align:center; padding:20px; color:#888;">Loading...</td>
        </tr>
    </tbody>
</table>

<script>
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function loadOrders() {
        fetch('/orders/api/')
            .then(response => response.json())
            .then(data => {
                var tbody = document.getElementById('orders-table');
                var html = '';

                if (data.orders.length === 0) {
                    html = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#888;">No orders yet.</td></tr>';
                } else {
                    data.orders.forEach(function(o) {
                        html += '<tr>';
                        html += '<td>#' + o.id + '</td>';
                        html += '<td>' + escapeHtml(o.facility) + '</td>';
                        html += '<td class="priority-' + o.priority_raw + '">' + escapeHtml(o.priority) + '</td>';
                        html += '<td><span class="badge badge-gray">' + escapeHtml(o.status) + '</span></td>';
                        html += '<td>' + escapeHtml(o.requested_at) + '</td>';
                        html += '</tr>';
                    });
                }

                tbody.innerHTML = html;
                document.getElementById('updated').textContent =
                    'updated ' + new Date().toLocaleTimeString();
            })
            .catch(error => {
                console.error('Error loading orders:', error);
                document.getElementById('updated').textContent = 'update failed';
            });
    }

    loadOrders();
    setInterval(loadOrders, 5000);
</script>
{% endblock %}
