<!DOCTYPE html>
<html>
<head>
    <title>Orders Dashboard - MedSupply Kenya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
        }
        h1 {
            color: #1a3d6d;
            border-bottom: 3px solid #1a3d6d;
            padding-bottom: 10px;
        }
        .live-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .updated {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #1a3d6d;
            color: white;
        }
        tr:hover {
            background-color: #f0f4f8;
        }
        .priority-critical { color: #c0392b; font-weight: bold; }
        .priority-urgent { color: #e67e22; font-weight: bold; }
        .priority-normal { color: #2e7d32; }
        .status {
            padding: 4px 10px;
            border-radius: 12px;
            background: #e0e0e0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>
        🇰🇪 MedSupply Kenya - Orders Dashboard
        <span class="live-badge">● LIVE</span>
        <span class="updated" id="updated">updating...</span>
    </h1>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Facility</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Requested</th>
            </tr>
        </thead>
        <tbody id="orders-table">
            <tr>
                <td colspan="5" style="text-align:center; padding:20px; color:#888;">Loading...</td>
            </tr>
        </tbody>
    </table>

    <script>
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadOrders() {
            fetch('/orders/api/')
                .then(response => response.json())
                .then(data => {
                    var tbody = document.getElementById('orders-table');
                    var html = '';

                    if (data.orders.length === 0) {
                        html = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#888;">No orders yet.</td></tr>';
                    } else {
                        data.orders.forEach(function(o) {
                            html += '<tr>';
                            html += '<td>#' + o.id + '</td>';
                            html += '<td>' + escapeHtml(o.facility) + '</td>';
                            html += '<td class="priority-' + o.priority_raw + '">' + escapeHtml(o.priority) + '</td>';
                            html += '<td><span class="status">' + escapeHtml(o.status) + '</span></td>';
                            html += '<td>' + escapeHtml(o.requested_at) + '</td>';
                            html += '</tr>';
                        });
                    }

                    tbody.innerHTML = html;
                    document.getElementById('updated').textContent =
                        'updated ' + new Date().toLocaleTimeString();
                })
                .catch(error => {
                    console.error('Error loading orders:', error);
                    document.getElementById('updated').textContent = 'update failed';
                });
        }

        // Load immediately, then every 5 seconds
        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
