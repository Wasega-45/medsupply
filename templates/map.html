{% extends 'base.html' %}
{% load static %}

{% block title %}Facility Map - MedSupply Kenya{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #map {
        width: 100%;
        height: 600px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        margin-top: 15px;
    }
    .drone-icon {
        background: #f59e0b;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 0 0 2px #f59e0b;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .map-legend {
        background: white;
        padding: 10px 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.8;
        color: #333;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; }
</style>

<div class="page-header">
    <h1>Facility Map &amp; GIS</h1>
    <p>Interactive map showing registered health facilities, supply hubs, and active drones</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize map (default to Kenya center)
    var map = L.map('map').setView([-0.0236, 37.9062], 6);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // --- LEGEND ---
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'map-legend');
        div.innerHTML = `
            <strong>Map Legend</strong><br>
            <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div> Active Facility</div>
            <div class="legend-item"><div class="legend-dot" style="background:#9ca3af;"></div> Pending Facility</div>
            <div class="legend-item"><div class="legend-dot" style="background:#14b8a6;"></div> Supply Hub</div>
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div> Drone</div>
        `;
        return div;
    };
    legend.addTo(map);

    // --- DATA ---
    var facilities = [
        {% for facility in facilities %}
        {
            name: "{{ facility.name }}",
            type: "{{ facility.get_facility_type_display }}",
            lat: {{ facility.latitude|default:"null" }},
            lng: {{ facility.longitude|default:"null" }},
            county: "{{ facility.county.name }}",
            status: "{{ facility.status }}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    var hubs = [
        {% for hub in hubs %}
        {
            name: "{{ hub.name }}",
            lat: {{ hub.latitude }},
            lng: {{ hub.longitude }},
            radius: {{ hub.service_radius_km }}
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    var markers = []; 

    // Facility markers (Blue for active, Gray for pending)
    facilities.forEach(function(f) {
        if (f.lat !== null && f.lng !== null) {
            var markerColor = f.status === 'active' ? '#3b82f6' : '#9ca3af'; 
            
            var marker = L.circleMarker([f.lat, f.lng], {
                radius: 8,
                fillColor: markerColor,
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);

            var statusLabel = f.status === 'active' ? '<span style="color:#3b82f6;font-weight:bold;">Active</span>' : '<span style="color:#9ca3af;font-weight:bold;">Pending Approval</span>';

            marker.bindPopup(
                "<strong>" + f.name + "</strong><br>" +
                "Type: " + f.type + "<br>" +
                "County: " + f.county + "<br>" +
                "Status: " + statusLabel
            );
            
            markers.push(marker); 
        }
    });

    // Hub markers with service area circles (green)
    hubs.forEach(function(h) {
        var hubMarker = L.marker([h.lat, h.lng], {
            icon: L.divIcon({
                className: 'custom-hub-marker',
                html: '<div style="background: #14b8a6; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 2px #14b8a6;"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            })
        }).addTo(map);

        hubMarker.bindPopup(
            "<strong>" + h.name + "</strong><br>" +
            "Service radius: " + h.radius + " km"
        );

        L.circle([h.lat, h.lng], {
            color: '#14b8a6',
            fillColor: '#14b8a6',
            fillOpacity: 0.08,
            weight: 2,
            radius: h.radius * 1000
        }).addTo(map);
        
        markers.push(hubMarker);
    });

    // --- AUTO-ZOOM LOGIC (Only for Kenya) ---
    var kenyaMarkers = markers.filter(function(m) {
        var latlng = m.getLatLng();
        // Kenya bounding box: roughly Lat -5 to 5, Lng 33 to 42
        return (latlng.lat > -5 && latlng.lat < 5 && latlng.lng > 33 && latlng.lng < 42);
    });

    if (kenyaMarkers.length > 0) {
        var group = new L.featureGroup(kenyaMarkers);
        map.fitBounds(group.getBounds().pad(0.2)); 
    }

    // --- DRONE SIMULATION LOGIC ---
    var droneMarkers = {};

    function fetchDrones() {
        fetch('/logistics/api/simulate-drones/')
            .then(response => response.json())
            .then(data => {
                return fetch('/logistics/api/drones/');
            })
            .then(response => response.json())
            .then(data => {
                updateDroneMarkers(data.drones);
            })
            .catch(error => console.error('Error fetching drones:', error));
    }

    function updateDroneMarkers(drones) {
        drones.forEach(function(d) {
            if (d.lat && d.lng) {
                if (droneMarkers[d.id]) {
                    droneMarkers[d.id].setLatLng([d.lat, d.lng]);
                } else {
                    var marker = L.marker([d.lat, d.lng], {
                        icon: L.divIcon({
                            className: 'custom-drone-marker',
                            html: '<div class="drone-icon"></div>',
                            iconSize: [22, 22],
                            iconAnchor: [11, 11]
                        })
                    }).addTo(map);
                    
                    marker.bindPopup("<strong>Drone: " + d.identifier + "</strong><br>Status: " + d.status);
                    droneMarkers[d.id] = marker;
                }
            }
        });
    }

    setInterval(fetchDrones, 3000);
    fetchDrones();
</script>
{% endblock %}
